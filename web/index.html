<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P4 文献版本系统</title><link rel="stylesheet" href="/style.css"></head>
<body><header><p>P4 · LOCAL RESEARCH</p><h1>文献、证据与修订</h1><p>原始证据 → 机器观察 / 人工复核 → 主张与矛盾 → 经许可的公开投影</p><strong>本地私有。机器稿不是已听校原话；位置数量不是作品数量。</strong></header>
<nav><button data-view="search">检索</button><button data-view="timeline">事件时间轴</button><button data-view="graph">关系拓扑</button><button data-view="identity">人物身份与参与</button><button data-view="reviews">私有人物审阅</button><button data-view="workflow">研究与发表工作流</button><button data-view="jobs">质量任务</button><button data-view="status">系统状态</button><button data-view="catalog">既有素材总账</button><button data-view="release">导出许可检查</button></nav>
<main><section id="controls"><button id="back" type="button">返回上一步</button><input id="query" placeholder="人物、项目、主张或稳定 ID" aria-label="检索词"><button id="run">应用筛选</button><div id="filters">
<label id="kind-wrap">类型 <select id="kind"><option value="">全部类型</option><option value="project">项目</option><option value="person">人物</option><option value="role">角色记录</option><option value="casting">角色分配</option><option value="event">事件</option><option value="segment">源片段</option><option value="claim">主张</option></select></label>
<div id="date-filters" hidden><label>起始年份 <input id="date-from" inputmode="numeric" placeholder="例如 2020" maxlength="4"></label><label>结束年份 <input id="date-to" inputmode="numeric" placeholder="例如 2026" maxlength="4"></label><label><input type="checkbox" id="unknown-date" checked>包括日期未知</label></div>
<label id="job-wrap" hidden>任务状态 <select id="job-state"><option value="">全部状态</option><option>pending</option><option>running</option><option>blocked</option><option>done</option><option>cancelled</option></select></label>
<div id="identity-filters" hidden><label><input id="identity-priority" type="checkbox">只看原无直接事件边</label><label>项目/事件 <select id="identity-context"><option value="">全部</option></select></label></div>
<div id="review-filters" hidden><label>人物/来源署名 <select id="review-person"><option value="">全部</option></select></label><label>项目 <select id="review-project"><option value="">全部</option></select></label><label>关系类型 <select id="review-relation"><option value="">全部</option></select></label><label>来源性质 <select id="review-nature"><option value="">全部</option></select></label><button id="review-clear-entity" type="button" hidden>取消人物卡范围</button></div><label id="destination-wrap" hidden>导出目的地 <select id="destination"><option value="github-index">GitHub 索引</option><option value="public-site">公开网站</option></select></label></div><p id="hint"></p></section><section id="results" aria-live="polite"></section><aside id="detail"><h2>记录详情</h2><p>选择记录查看来源、可靠性、权限与修订；可从详情聚焦关系图。</p></aside></main><footer>GitHub 只接收经审核的代码 / 公开索引；原片与研究底稿留本地。此界面无上传或发布按钮。</footer><script src="/app.js"></script></body></html>
